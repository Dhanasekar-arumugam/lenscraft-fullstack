
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lenscraft Studio</title>

  <script>
    (function () {
      var segmentCount = 1;
      var location = window.location;

      var redirect =
        location.protocol +
        "//" +
        location.hostname +
        (location.port ? ":" + location.port : "") +
        location.pathname
          .split("/")
          .slice(0, 1 + segmentCount)
          .join("/") +
        "/?/" +
        location.pathname
          .slice(1)
          .split("/")
          .slice(segmentCount)
          .join("/")
          .replace(/&/g, "~and~") +
        (location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "") +
        location.hash;

      location.replace(redirect);
    })();
  </script>
</head>
<body>
  <p>Redirecting to Lenscraft Studio...</p>
</body>
</html>
