
<script>
  (function () {
    var redirect = window.location.search;

    if (redirect.startsWith("?/")) {
      var decoded = redirect
        .slice(2)
        .replace(/~and~/g, "&");

      window.history.replaceState(
        null,
        "",
        "/" + decoded + window.location.hash
      );
    }
  })();
</script>
